<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="m-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Outer Gradient Border -->
  <rect x="1" y="1" width="62" height="62" rx="16" fill="url(#m-border)" />

  <!-- Pure White Background -->
  <rect x="4" y="4" width="56" height="56" rx="13" fill="#ffffff" />

  <!-- Bold High-Contrast Blue 'M' -->
  <text 
    x="32" 
    y="44" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Display', sans-serif" 
    font-size="36" 
    font-weight="900" 
    letter-spacing="-1"
    fill="#2563eb"
  >M</text>
</svg>
